# electron-builder 打包配置（CI 由 GitHub Actions 调用：npx electron-builder --win/--mac）
appId: dev.oduan.xpost
productName: X-Post
directories:
  output: release
  buildResources: build

# 主进程、预加载、渲染层与应用内图标（托盘/窗口图标，main.js 用 __dirname 直连）；devDependencies 自动排除
files:
  - main.js
  - preload.js
  - lib/**
  - renderer/**
  - icons/**
  - package.json

# 浏览器扩展随应用打包到 resources/extension：
# 设置面板「安装扩展」引导中的路径（main.js extensionDir()）指向这里
extraResources:
  - from: ../extension
    to: extension

# GitHub Releases：electron-updater 依赖此处生成的 app-update.yml（Windows 自动更新）
# releaseType: release —— 直接发布/追加到正式 Release；
# 默认 draft 策略遇到已发布的同名 Release 会跳过上传
publish:
  provider: github
  owner: oduan
  repo: x-post
  releaseType: release

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: X-Post

mac:
  icon: build/icon.png
  category: public.app-category.social-networking
  # 无签名证书：跳过公证签名（用户首次打开需右键→打开，或去除隔离属性；
  # 未签名构建无法用 Squirrel 自动更新，客户端会改为打开 Releases 页手动下载）
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
