name: Release

# 推送 v* 标签时：构建 Windows/macOS 安装包并连同浏览器扩展 zip 一起发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  app:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
          - name: macOS
            os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version from tag
        shell: bash
        run: node ../tools/set-version.js "${GITHUB_REF_NAME#v}" --app-only

      # postinstall 会用 electron-rebuild 重编译 better-sqlite3（Electron ABI）
      - name: Install dependencies
        run: npm ci

      # --publish always：上传安装包与 latest.yml（electron-updater 的更新元数据）到该 tag 对应的 Release
      - name: Build & publish
        run: npx electron-builder --publish always ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version from tag
        run: node tools/set-version.js "${GITHUB_REF_NAME#v}" --extension-only

      - name: Zip extension
        run: |
          cd extension
          zip -r "../x-post-extension-${GITHUB_REF_NAME}.zip" . -x '*.DS_Store' -x '*__MACOSX*'

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: x-post-extension-*.zip
